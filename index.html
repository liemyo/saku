<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SakuMac</title>
<meta name="description" content="SakuMac versi web: catatan keuangan pribadi — dompet, transaksi, kategori, utang/piutang, laporan per kategori & per bulan, impor Sepran, backup ke Gmail.">
<meta name="theme-color" content="#1a8566">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%231a8566'/><path d='M28 66c0-22 16-36 42-36-3 26-18 42-38 42l-7 7' fill='none' stroke='white' stroke-width='8' stroke-linecap='round'/></svg>">
<style>:root{color-scheme:light;--bg:#f5f6f4;--side:#eceeeb;--card:#ffffff;--card2:#f3f5f3;--ink:#0b1310;--muted:#3d4a44;--line:#e1e5e2;--accent:#1a8566;--accent-soft:rgba(26,133,102,.1);--accent-ink:#fff;--red:#d64545;--red-soft:rgba(214,69,69,.09);--input:#fff;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1d1f;--side:#141516;--card:#26282a;--card2:#2c2f31;--ink:#ffffff;--muted:#d0d7d3;--line:#3a3e41;--accent:#3fb88f;--accent-soft:rgba(58,167,132,.14);--accent-ink:#06130e;--red:#ff8080;--red-soft:rgba(239,107,107,.12);--input:#1f2123;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1d1f;--side:#141516;--card:#26282a;--card2:#2c2f31;--ink:#ffffff;--muted:#d0d7d3;--line:#3a3e41;--accent:#3fb88f;--accent-soft:rgba(58,167,132,.14);--accent-ink:#06130e;--red:#ff8080;--red-soft:rgba(239,107,107,.12);--input:#1f2123;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-size:19px;display:block}.brand small{color:var(--muted);font-size:11.5px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;font-size:14px;white-space:nowrap}
nav button svg{width:18px;height:18px;color:var(--accent);flex:none}
nav button.on{background:var(--accent);color:var(--accent-ink)}nav button.on svg{color:var(--accent-ink)}
nav button:not(.on):hover{background:var(--accent-soft)}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 6px}
.side-foot div:first-child{color:var(--ink)}
main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:24px 28px;border-bottom:1px solid var(--line)}
.top h1{font-size:27px;font-weight:600;margin:0;letter-spacing:-.01em}.top p{margin:3px 0 0;color:var(--muted)}
.top .sp{flex:1}
.view{flex:1;overflow:auto;padding:24px 28px 40px}
.msg{display:flex;gap:10px;align-items:center;padding:11px 16px;background:var(--accent-soft);border-top:1px solid var(--line)}
.msg span{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted)}.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
input[type=text],input[type=search],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{background:var(--input);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.chk{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:12px}.red{color:var(--red)}.acc{color:var(--accent)}.bold{font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.metric{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.metric .h{display:flex;justify-content:space-between;color:var(--muted)}
.metric .v{font-size:23px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{font-size:18px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.wallet{background:var(--accent-soft);border-radius:12px;padding:18px 20px;display:flex;gap:12px;align-items:center}
.wallet .n{color:var(--muted)}.wallet .b{font-size:17px;font-weight:700}
.card{background:var(--card);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.group{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:22px}
.group>.t{font-weight:600;font-size:12.5px;color:var(--muted);margin:-2px 0 12px;text-transform:none}
.entry{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none;font-size:17px}
.entry .main{flex:1;min-width:0}.entry .main div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .main div:last-child{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .amt{font-weight:600;white-space:nowrap}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;z-index:20;min-width:170px}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer}
.menu-pop button:hover{background:var(--accent-soft)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.catrow{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer}
.catrow.on{background:var(--accent-soft)}
.catrow .l{display:flex;gap:8px;align-items:center}.catrow .bar{height:7px;border-radius:4px;margin-top:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.split{display:flex;gap:28px;align-items:flex-start}
.split>svg{flex:none}
table.months{width:100%;border-collapse:collapse}
table.months th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.months td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.months tr.click{cursor:pointer}table.months tr.click:hover td{background:var(--accent-soft)}
table.months tr.hl td{background:var(--red-soft);font-weight:600}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:14px;padding:26px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 16px;font-size:20px}
.form{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:center}
.form>label{color:var(--muted)}
.form input,.form select{width:100%}
.err{color:var(--red);min-height:18px;margin-top:10px}
.actions{display:flex;justify-content:space-between;margin-top:14px}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
.lock .box{text-align:center;display:grid;gap:14px;justify-items:center}
.chart-x{font-size:10.5px;fill:var(--muted)}
.hide-sm{}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  aside{flex-direction:column;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .side-foot{display:none}
  main{overflow:visible}.view{overflow:visible;padding:18px 16px 40px}
  .top{padding:16px}.top h1{font-size:22px}.top p{display:none}
  .split{flex-direction:column;align-items:stretch}.split>svg{align-self:center}
  .form{grid-template-columns:1fr}
  .hide-sm{display:none}
  .tablewrap{overflow-x:auto}
}
@media print{
  aside,.top .btn,.msg,.noprint{display:none!important}
  .app{display:block;height:auto}main,.view{overflow:visible}
  body{background:#fff;color:#000}
  .card,.group,.metric{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
}
.wallet svg{width:22px;height:22px;flex:none}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:hidden;background:radial-gradient(1200px 700px at 15% 10%,#2fa47f 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#1b5e8c 0%,transparent 55%),linear-gradient(160deg,#0d2a22,#0b1a26)}
.gate-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 65%);top:-140px;right:-120px;filter:blur(10px)}
.gate-card{position:relative;width:min(380px,100%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px;padding:36px 28px 26px;text-align:center;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gate-logo{width:72px!important;height:72px!important;margin:0 auto 12px;box-shadow:0 10px 30px rgba(47,164,127,.5);background:linear-gradient(135deg,#3cc497,#1a8566)!important}
.gate h1{margin:0;font-size:28px;letter-spacing:-.02em}
.gate-sub{margin:4px 0 26px;color:rgba(255,255,255,.72)}
.gate-field{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:4px 14px;text-align:left}
.gate-field:focus-within{border-color:#4fd1a5;box-shadow:0 0 0 3px rgba(79,209,165,.25)}
.gate-field input{flex:1;background:none!important;border:0!important;outline:0!important;color:#fff;font-size:16px;padding:10px 0}
.gate-field input::placeholder{color:rgba(255,255,255,.55)}
.gate-btn{width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:600;border-radius:14px;background:linear-gradient(135deg,#3cc497,#1a8566)!important;border:0!important;color:#fff!important}
.gate .red{color:#ffb3b3;min-height:18px;margin-top:10px}
.gate-note{color:rgba(255,255,255,.6);font-size:12.5px;margin:6px 0 0;line-height:1.5}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:6px 8px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.hide-lg{display:none}
@media (max-width:820px){.hide-lg{display:inline-flex}}
@media (max-width:820px){.top{gap:8px}.top .btn{padding:6px 10px}}

/* Readability: crisp, high-contrast text everywhere */
body{font-size:15px;font-weight:450;-webkit-font-smoothing:auto;text-rendering:optimizeLegibility}
input,select,textarea{color:var(--ink)!important;font-weight:500;font-size:15px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input[type=date],input[type=datetime-local]{color:var(--ink)!important}
input::-webkit-datetime-edit,input::-webkit-datetime-edit-fields-wrapper,input::-webkit-datetime-edit-text{color:var(--ink)}
input::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input::-webkit-calendar-picker-indicator{filter:invert(1)}}
:root[data-theme="dark"] input::-webkit-calendar-picker-indicator{filter:invert(1)}
.muted{color:var(--muted)}
.small{font-size:13px}
.entry .main div:last-child{font-size:13px;color:var(--muted)}
.entry .main div:first-child{font-weight:600}
.form>label{color:var(--ink);font-weight:600}
.metric .h{color:var(--muted);font-weight:500}
table.months th{color:var(--muted)}
.chart-x{fill:var(--muted);font-size:11.5px}
.group>.t{color:var(--ink);font-size:13.5px}
nav button{font-weight:500}
/* Daily transactions */
.daybar{display:flex;align-items:center;gap:14px;justify-content:center}
.day-nav{width:46px;height:46px;border-radius:50%;font-size:24px;line-height:1;padding:0;display:grid;place-items:center}
.day-title{text-align:center;min-width:220px}.day-title .bold{font-size:19px}
.add-day{width:100%;margin-top:12px;padding:10px}
.metrics.two{grid-template-columns:1fr 1fr}
@media (max-width:820px){.metrics.two .metric{padding:14px 16px}.metrics.two .v{font-size:18px}.entry{gap:10px}.entry .ic{width:34px;height:34px}}
</style>

<body>
<div id="app"><div style="padding:40px;font-family:sans-serif;color:#888">Memuat SakuMac…</div></div>
<dialog id="dlg"></dialog>
<noscript>SakuMac memerlukan JavaScript.</noscript>
<script>// SakuMac Web — core logic (no DOM). Same data format as the SakuMac Mac app (ledger.json / backup JSON).
const KINDS = ['Pengeluaran', 'Pemasukan', 'Transfer'];
const MAX = 1e15;
const uuid = () => crypto.randomUUID().toUpperCase();
const iso = d => new Date(d).toISOString().replace(/\.\d{3}Z$/, 'Z'); // Swift .iso8601 rejects fractional seconds
const pad = n => String(n).padStart(2, '0');
const ymd = d => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthStart = d => { d = new Date(d); return new Date(d.getFullYear(), d.getMonth(), 1); };
const addMonths = (d, n) => { d = new Date(d); return new Date(d.getFullYear(), d.getMonth() + n, d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()); };
const addDays = (d, n) => { d = new Date(d); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes(), d.getSeconds()); };
const startOfDay = d => { d = new Date(d); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const _fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0, minimumFractionDigits: 0 });
const money = n => _fmt.format(n).replace(/\s/g, '');
function compact(n) {
  const v = Math.abs(n), s = n < 0 ? '-' : '';
  if (v >= 1e9) return s + (v / 1e9).toFixed(1).replace('.', ',') + ' M';
  if (v >= 1e6) return s + (v / 1e6).toFixed(1).replace('.', ',') + ' jt';
  if (v >= 1e3) return s + Math.round(v / 1e3) + ' rb';
  return String(n);
}
const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const MSHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const monthName = (d, short) => { d = new Date(d); return short ? `${MSHORT[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` : `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const dateText = (d, time) => { d = new Date(d); const s = `${d.getDate()} ${MSHORT[d.getMonth()]} ${d.getFullYear()}`; return time ? `${s}, ${pad(d.getHours())}.${pad(d.getMinutes())}` : s; };

class AppError extends Error {}
const fail = m => { throw new AppError(m); };

function parseAmount(text) {
  const s = String(text ?? '').trim();
  if (!/^\d+$/.test(s) || Number(s) > MAX) fail('Masukkan nominal Rupiah bulat tanpa titik/koma, maksimal 1 kuadriliun.');
  return Number(s);
}

function defaultLedger() {
  const c = (name, income = false) => ({ id: uuid(), income, name });
  return { format: 'SakuMac', version: 1, cycleDay: 1, debts: [], entries: [],
    wallets: [{ id: uuid(), name: 'Tunai', opening: 0 }, { id: uuid(), name: 'Bank', opening: 0 }],
    categories: [c('Makan & minum'), c('Transportasi'), c('Belanja'), c('Tagihan'), c('Kesehatan'), c('Lainnya'), c('Gaji', true), c('Pendapatan lain', true)] };
}

function validate(l) {
  if (!l || l.format !== 'SakuMac' || l.version !== 1) fail('Format backup belum didukung. Gunakan backup SakuMac (JSON).');
  for (const k of ['wallets', 'categories', 'entries', 'debts']) if (!Array.isArray(l[k])) fail('Backup tidak valid.');
  if (!l.wallets.length || !(l.cycleDay >= 1 && l.cycleDay <= 28) || l.entries.length >= 1e6) fail('Backup tidak valid.');
  const uniq = a => new Set(a.map(x => x.id)).size === a.length;
  if (!uniq(l.wallets) || !uniq(l.categories) || !uniq(l.entries) || !uniq(l.debts)) fail('ID duplikat dalam backup.');
  const ws = new Set(l.wallets.map(w => w.id)); const cs = new Map(l.categories.map(c => [c.id, c]));
  if (!l.wallets.every(w => String(w.name ?? '').trim() && Number.isInteger(w.opening) && Math.abs(w.opening) <= MAX) || !l.categories.every(c => String(c.name ?? '').trim()))
    fail('Dompet atau kategori tidak valid.');
  for (const e of l.entries) {
    if (!KINDS.includes(e.kind) || !Number.isInteger(e.amount) || e.amount <= 0 || e.amount > MAX || !ws.has(e.wallet) || isNaN(Date.parse(e.date))) fail('Transaksi tidak valid.');
    if (e.kind === 'Transfer') { if (!e.destination || !ws.has(e.destination) || e.destination === e.wallet) fail('Dompet transfer tidak valid.'); }
    else if (e.category != null) { const c = cs.get(e.category); if (!c || c.income !== (e.kind === 'Pemasukan')) fail('Kategori transaksi tidak sesuai.'); }
  }
  const byId = new Map(l.entries.map(e => [e.id, e]));
  for (const d of l.debts) {
    if (!Array.isArray(d.payments) || d.payments.length >= 1000 || !d.payments.every(p => Number.isInteger(p.amount) && p.amount > 0 && p.amount <= MAX)) fail('Daftar pembayaran tidak valid.');
    if (!Number.isInteger(d.amount) || d.amount <= 0 || d.amount > MAX || !d.name || remaining(d) < 0) fail('Utang/piutang tidak valid.');
    for (const p of d.payments) { const e = byId.get(p.entry); if (!e || e.amount !== p.amount || e.wallet !== p.wallet || e.kind !== (d.receivable ? 'Pemasukan' : 'Pengeluaran')) fail('Pembayaran utang tidak konsisten.'); }
  }
}
const remaining = d => d.amount - d.payments.reduce((s, p) => s + p.amount, 0);
const walletName = (l, id) => l.wallets.find(w => w.id === id)?.name ?? '—';
const categoryName = (l, id) => l.categories.find(c => c.id === id)?.name ?? '—';
function balance(l, id) {
  let v = l.wallets.find(w => w.id === id)?.opening ?? 0;
  for (const e of l.entries) { if (e.wallet === id) v += e.kind === 'Pemasukan' ? e.amount : -e.amount; if (e.kind === 'Transfer' && e.destination === id) v += e.amount; }
  return v;
}
const isPayment = (l, id) => l.debts.some(d => d.payments.some(p => p.entry === id));
const clone = l => JSON.parse(JSON.stringify(l));
function upsert(l, entry) {
  const n = clone(l); const i = n.entries.findIndex(e => e.id === entry.id);
  if (i >= 0) { if (isPayment(l, entry.id)) fail('Transaksi pembayaran utang tidak dapat diedit langsung.'); n.entries[i] = entry; } else n.entries.push(entry);
  return n;
}
function removeEntry(l, id) { if (isPayment(l, id)) fail('Pembayaran utang tidak dapat dihapus dari daftar transaksi.'); const n = clone(l); n.entries = n.entries.filter(e => e.id !== id); return n; }
function pay(l, debtId, amount, wallet) {
  const n = clone(l); const d = n.debts.find(x => x.id === debtId);
  if (!d || !(amount > 0) || amount > remaining(d)) fail('Nominal pembayaran melebihi sisa utang/piutang.');

function niceStep(max) { const raw = max / 3; const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function vSettings() {
  const app = ls.get('appearance') || 'Sistem'; const last = Number(ls.get('lastMail') || 0);
  return `<div class="group"><div class="t">Tampilan & periode</div><div class="row"><label class="row" style="gap:6px">Tampilan <select data-a-change="theme">${['Sistem', 'Terang', 'Gelap'].map(t => opt(t, t, app === t)).join('')}</select></label>
      <label class="row" style="gap:6px">Mulai periode tanggal <input type="number" id="cycle" min="1" max="28" value="${L.cycleDay}" style="width:70px"></label><button class="btn" data-a="cycle">Simpan periode</button></div></div>
    <div class="group"><div class="t">Keamanan</div><p style="margin:0 0 10px">${ls.get('pin') ? 'PIN aktif. Halaman terkunci saat dibuka dan saat tab disembunyikan.' : 'PIN belum diaktifkan.'}</p>
      <div class="row"><input type="password" id="pin1" inputmode="numeric" placeholder="PIN baru (6–12 angka)" class="grow"><input type="password" id="pin2" inputmode="numeric" placeholder="Ulangi PIN" class="grow"><button class="btn" data-a="pinset">Aktifkan / ubah PIN</button>${ls.get('pin') ? '<button class="btn" data-a="pinoff">Nonaktifkan</button>' : ''}</div>
      <p class="muted small">PIN hanya mengunci tampilan di browser ini; data tidak dienkripsi. Touch ID hanya tersedia di aplikasi Mac.</p></div>
    <div class="group"><div class="t">Backup lokal & ekspor</div>
      <div class="row"><button class="btn" data-a="bsave">Simpan backup lengkap</button><button class="btn" data-a="bopen">Pulihkan backup…</button><button class="btn" data-a="csvall">Ekspor semua CSV</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" data-a="csvopen">Impor CSV SakuMac…</button><button class="btn" data-a="xlsxopen">Impor Excel Sepran…</button>${hasServer ? '<button class="btn" data-a="server">Samakan dengan data server</button>' : ''}</div>
      <p class="muted small">Backup mencakup dompet, saldo awal, kategori, transaksi, utang/piutang, pembayaran, dan periode laporan — formatnya sama dengan aplikasi SakuMac di Mac, jadi bisa dipindah dua arah. Pemulihan mengganti data setelah konfirmasi; salinan sebelum perubahan disimpan di browser.</p></div>
    <div class="group"><div class="t">Backup ke Gmail</div><p class="muted" style="margin:0 0 10px">Kirim berkas backup lengkap ke alamat Gmail Anda.</p>
      <div class="row"><input type="text" id="gmail" placeholder="Alamat Gmail Anda" value="${esc(ls.get('gmail') || '')}" style="width:300px"><button class="btn primary" data-a="mail">Kirim backup ke Gmail</button></div>
      <label class="chk" style="margin-top:10px"><input type="checkbox" data-a-change="weekly" ${ls.get('weeklyMail') === '1' ? 'checked' : ''}> Ingatkan saya mengirim backup ke Gmail setiap minggu</label>
      ${last ? `<p class="muted small">Backup email terakhir disiapkan: ${dateText(last, true)}</p>` : ''}
      <p class="muted small">Di iPhone/iPad/Mac (Safari) akan muncul menu Bagikan: pilih Mail atau Gmail, berkas sudah terlampir. Di browser lain berkas backup diunduh dan Gmail dibuka di tab baru — lampirkan berkas yang baru diunduh, lalu kirim. Untuk memulihkan: unduh lampiran dari Gmail → Pulihkan backup….</p></div>
    <div class="group"><div class="t">Tentang data</div><p style="margin:0">Data tersimpan di browser ini (${L.entries.length} transaksi, ${L.wallets.length} dompet, ${L.categories.length} kategori). Pengguna: <b>${esc(USER)}</b>. Browser atau perangkat lain punya salinan sendiri: pindahkan dengan backup${hasServer ? ', atau klik <b>Samakan dengan data server</b>' : ''}. Menghapus data situs di browser akan menghapus perubahan yang belum di-backup.</p></div>
    <p class="muted small">SakuMac Web • versi web dari aplikasi SakuMac • Bukan produk resmi Sepran</p>`;
}
function gateView() {
  return `<div class="gate"><div class="gate-glow"></div><form class="gate-card" id="gate-form" autocomplete="off">
    ${LOGO.replace('width="20" height="20"', 'width="38" height="38"').replace('class="logo"', 'class="logo gate-logo"')}
    <h1>SakuMac</h1><p class="gate-sub">Catatan keuangan pribadi</p>
    <label class="gate-field"><span>👤</span><input id="user-in" name="user" type="text" placeholder="Nama pengguna" autocapitalize="none" spellcheck="false" maxlength="32" required></label>
    <button class="btn primary gate-btn" type="submit">Masuk</button>
    <div class="red small" id="gate-err" role="alert"></div>
    <p class="gate-note">Setiap nama pengguna memiliki buku catatan sendiri. Nama yang belum pernah dipakai akan membuat buku catatan baru.</p>
  </form></div>`;
}
function lockView() {
  return `<div class="lock"><div class="box">${LOGO.replace('width="20" height="20"', 'width="34" height="34"').replace('class="logo"', 'class="logo" style="width:64px;height:64px"')}<h2 style="margin:0">Buka SakuMac</h2>
    <input type="password" id="pin-in" inputmode="numeric" placeholder="PIN" style="width:220px;text-align:center"><button class="btn primary" data-a="unlock">Buka dengan PIN</button><div class="red" id="pin-err"></div></div></div>`;
}
async function hashPin(pin, salt) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

// ---------- dialogs ----------
const dlg = () => $('#dlg');
function openDialog(html, onSubmit) {
  const d = dlg(); d.onclick = null; d.innerHTML = `<form method="dialog" id="dlg-form">${html}<div class="err" id="dlg-err"></div></form>`; d.showModal();
  $('#dlg-form').onsubmit = async ev => { ev.preventDefault(); if (ev.submitter?.value === 'cancel') return d.close(); try { await onSubmit(new FormData(ev.target)); d.close(); render(); } catch (e) { $('#dlg-err').textContent = e.message; } };
  setTimeout(() => d.querySelector('input:not([type=hidden]),select')?.focus(), 30);
}
const dlgButtons = (ok = 'Simpan') => `<div class="actions"><button class="btn" value="cancel" formnovalidate>Batal</button><button class="btn primary" value="ok">${ok}</button></div>`;
function defaultEntryDate() {
  const t = new Date(); const at = d => new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.getHours(), t.getMinutes());
  if (ui.section === 'Transaksi') return at(ui.day);
  if (ui.section === 'Laporan' && ui.rep.mode === 'Bulanan' && +ui.rep.month !== +monthStart(t)) return at(ui.rep.month);
  return t;
}
function entryDialog(existing) {
  let kind = existing?.kind || 'Pengeluaran'; const kinds = kind === 'Transfer' ? KINDS : ['Pengeluaran', 'Pemasukan']; const when = existing ? existing.date : defaultEntryDate();
  let first = true;
  const draw = () => {
    const cats = L.categories.filter(c => c.income === (kind === 'Pemasukan')); const f = first ? null : $('#dlg-form'); first = false; const keep = f ? Object.fromEntries(new FormData(f)) : {};
    const v = (k, d) => keep[k] ?? d;
    return `<h3>${existing ? 'Edit / ulangi transaksi' : 'Tambah transaksi'}</h3><div class="seg" style="margin-bottom:16px">${kinds.map(k => `<button type="button" data-kind="${k}" class="${k === kind ? 'on' : ''}">${k}</button>`).join('')}</div>
      <div class="form"><label>Nominal</label><input name="amount" inputmode="numeric" placeholder="Rupiah tanpa pemisah" value="${esc(v('amount', existing ? existing.amount : ''))}">
      <label>Tanggal dan waktu</label><input name="date" type="datetime-local" value="${esc(v('date', dtInput(when)))}">
      ${kind === 'Transfer' ? `<label>Dompet</label><select name="wallet">${L.wallets.map(w => opt(w.id, w.name, v('wallet', existing?.wallet) === w.id)).join('')}</select>` : `<input type="hidden" name="wallet" value="${esc(existing?.wallet || defaultWallet())}">`}
      ${kind === 'Transfer' ? `<label>Dompet tujuan</label><select name="destination">${opt('', 'Pilih dompet')}${L.wallets.map(w => opt(w.id, w.name, v('destination', existing?.destination) === w.id)).join('')}</select>`
        : `<label>Kategori</label><select name="category">${opt('', 'Tanpa kategori')}${cats.map(c => opt(c.id, c.name, v('category', existing?.category) === c.id)).join('')}</select>`}
      <label>Catatan</label><input name="note" value="${esc(v('note', existing?.note || ''))}"></div>${dlgButtons()}`;
  };
  openDialog(draw(), fd => {
    const w = fd.get('wallet'); const amount = parseAmount(fd.get('amount')); const d = new Date(fd.get('date')); if (isNaN(d)) fail('Tanggal tidak valid.');
    const e = { id: existing?.id || uuid(), date: iso(d), kind, amount, wallet: w, note: String(fd.get('note') || '') };
    if (kind === 'Transfer') { const dest = fd.get('destination'); if (!dest) fail('Pilih dompet tujuan.'); if (dest === w) fail('Dompet tujuan harus berbeda.'); e.destination = dest; }
    else if (fd.get('category')) e.category = fd.get('category');
    commit(upsert(L, e)); if (ui.section === 'Transaksi') ui.day = startOfDay(d);
  });
  dlg().onclick = ev => { const b = ev.target.closest('[data-kind]'); if (!b) return; kind = b.dataset.kind; const f = $('#dlg-form'); const html = draw(); f.innerHTML = html + '<div class="err" id="dlg-err"></div>'; };
}
function debtDialog() {
  openDialog(`<h3>Catat utang / piutang</h3><div class="form"><label>Nama pihak</label><input name="name"><label>Jenis</label><select name="rec">${opt('0', 'Utang (saya berutang)')}${opt('1', 'Piutang (orang lain berutang kepada saya)')}</select>
    <label>Nominal</label><input name="amount" inputmode="numeric"><label>Tanggal</label><input type="date" name="date" value="${dateInput(new Date())}"><label>Jatuh tempo</label><input type="date" name="due" value="${dateInput(new Date())}"><label>Catatan</label><input name="note"></div>${dlgButtons()}`,
  fd => { const n = JSON.parse(JSON.stringify(L)); const name = String(fd.get('name') || '').trim(); if (!name) fail('Nama pihak wajib diisi.');
    n.debts.push({ id: uuid(), name, receivable: fd.get('rec') === '1', amount: parseAmount(fd.get('amount')), date: iso(fromDateInput(fd.get('date'))), due: iso(fromDateInput(fd.get('due'))), note: String(fd.get('note') || ''), payments: [] }); commit(n); });
}
function payDialog(d) {
  openDialog(`<h3>Pembayaran: ${esc(d.name)}</h3><p>Sisa ${money(remaining(d))}</p><div class="form"><label>Nominal</label><input name="amount" inputmode="numeric" value="${remaining(d)}"><input type="hidden" name="wallet" value="${defaultWallet()}"></div>${dlgButtons('Simpan pembayaran')}`,
    fd => commit(pay(L, d.id, parseAmount(fd.get('amount')), fd.get('wallet'))));
}
function confirmDialog(title, text, okLabel, action) { openDialog(`<h3>${esc(title)}</h3><p>${esc(text)}</p>${dlgButtons(okLabel)}`, action); }
function previewRestore(l, source) {
  validate(l);
  confirmDialog('Pulihkan backup?', `${source} berisi ${l.entries.length} transaksi, ${l.wallets.length} dompet, dan ${l.debts.length} utang/piutang. Data di browser ini akan diganti (saat ini ${L.entries.length} transaksi). Salinan data sebelumnya disimpan.`, 'Ganti data dengan backup',
    () => { restore(l); ui.msg = `Backup dipulihkan: ${l.entries.length} transaksi.`; });
}
function pickFile(accept, handler) { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = async () => { const f = i.files[0]; if (f) try { await handler(f); } catch (e) { ui.msg = e.message; } render(); }; i.click(); }

// ---------- actions ----------
const A = {
  nav: b => { ui.section = b.dataset.s; ui.menu = null; window.scrollTo(0, 0); },
  msgx: () => { ui.msg = ''; }, new: () => entryDialog(null), more: () => { ui.tx.limit += 300; },
  lock: () => { ui.locked = true; },
  menu: b => { ui.menu = ui.menu === b.dataset.id ? null : b.dataset.id; },
  edit: b => { ui.menu = null; entryDialog(L.entries.find(e => e.id === b.dataset.id)); },
  repeat: b => { ui.menu = null; const e = { ...L.entries.find(x => x.id === b.dataset.id) }; e.id = uuid(); e.date = iso(new Date()); entryDialog(e); },
  del: b => { ui.menu = null; const e = L.entries.find(x => x.id === b.dataset.id); confirmDialog('Hapus transaksi?', `${e.note || e.kind} · ${money(e.amount)} · ${dateText(e.date)}`, 'Hapus', () => commit(removeEntry(L, e.id))); },
  wsave: () => { const w = ui.wal; const n = JSON.parse(JSON.stringify(L)); const name = w.name.trim(); const v = parseAmount(w.opening) * (w.negative ? -1 : 1);
    if (!name || n.wallets.some(x => x.name === name && x.id !== w.id)) fail('Nama dompet kosong atau sudah digunakan.');
    if (w.id) Object.assign(n.wallets.find(x => x.id === w.id), { name, opening: v }); else n.wallets.push({ id: uuid(), name, opening: v });
    commit(n); ui.wal = { id: null, name: '', opening: '0', negative: false }; },
  wcancel: () => { ui.wal = { id: null, name: '', opening: '0', negative: false }; },
  wedit: b => { const w = L.wallets.find(x => x.id === b.dataset.id); ui.wal = { id: w.id, name: w.name, opening: String(Math.abs(w.opening)), negative: w.opening < 0 }; },
  wdel: b => { const id = b.dataset.id; if (L.wallets.length <= 1 || L.entries.some(e => e.wallet === id || e.destination === id)) fail('Dompet yang memiliki transaksi atau dompet terakhir tidak dapat dihapus.');
    const n = JSON.parse(JSON.stringify(L)); n.wallets = n.wallets.filter(x => x.id !== id); commit(n); },
  csave: () => { const c = ui.cat; const n = JSON.parse(JSON.stringify(L)); const name = c.name.trim();
    if (!name || n.categories.some(x => x.name === name && x.income === c.income && x.id !== c.id)) fail('Nama kategori kosong atau sudah digunakan.');
    if (c.id) { if (L.categories.find(x => x.id === c.id).income !== c.income && L.entries.some(e => e.category === c.id)) fail('Jenis kategori tidak dapat diubah karena sudah dipakai transaksi.'); Object.assign(n.categories.find(x => x.id === c.id), { name, income: c.income }); }
    else n.categories.push({ id: uuid(), income: c.income, name });
    commit(n); ui.cat = { id: null, name: '', income: false }; },
  ccancel: () => { ui.cat = { id: null, name: '', income: false }; },
  cedit: b => { const c = L.categories.find(x => x.id === b.dataset.id); ui.cat = { id: c.id, name: c.name, income: c.income }; },
  cdel: b => { const id = b.dataset.id; if (L.entries.some(e => e.category === id)) fail('Kategori sedang digunakan oleh transaksi.'); const n = JSON.parse(JSON.stringify(L)); n.categories = n.categories.filter(x => x.id !== id); commit(n); },
  dnew: () => debtDialog(), dpay: b => payDialog(L.debts.find(d => d.id === b.dataset.id)),
  ddel: b => { const d = L.debts.find(x => x.id === b.dataset.id); if (d.payments.length) fail('Catatan dengan pembayaran tidak dapat dihapus.'); const n = JSON.parse(JSON.stringify(L)); n.debts = n.debts.filter(x => x.id !== d.id); commit(n); },
  rmode: b => { ui.rep.mode = b.dataset.m; ls.set('reportMode', b.dataset.m); },
  rprev: () => { ui.rep.month = addMonths(ui.rep.month, -1); }, rnext: () => { ui.rep.month = addMonths(ui.rep.month, 1); }, rthis: () => { ui.rep.month = monthStart(new Date()); },
  rsel: b => { ui.rep.selected = ui.rep.selected === b.dataset.k ? null : b.dataset.k; }, rall: () => { ui.rep.selected = null; },
  rpick: b => { ui.rep.mode = 'Bulanan'; ls.set('reportMode', 'Bulanan'); ui.rep.month = new Date(Number(b.dataset.m)); },
  xsum: () => { const r = ui._report; download('Ringkasan-pengeluaran.csv', '﻿' + Reports.summaryCSV(r.cats, r.months, 'Pengeluaran ' + r.title), 'text/csv'); },
  xtx: () => download('Laporan-SakuMac.csv', '﻿' + CSV.export(L, ui._report.entries), 'text/csv'),
  xpdf: () => setTimeout(() => window.print(), 50),
  cycle: () => { const v = Number($('#cycle').value); if (!(v >= 1 && v <= 28)) fail('Tanggal periode 1–28.'); commit({ ...JSON.parse(JSON.stringify(L)), cycleDay: v }); ui.msg = 'Periode laporan disimpan.'; },
  pinset: async () => { const a = $('#pin1').value, b = $('#pin2').value; if (!/^\d{6,12}$/.test(a)) fail('PIN harus 6–12 angka.'); if (a !== b) fail('Konfirmasi PIN tidak sama.');
    const salt = uuid(); ls.set('pin', JSON.stringify({ salt, hash: await hashPin(a, salt) })); ui.msg = 'PIN tersimpan di browser ini.'; },
  pinoff: () => { ls.del('pin'); ui.msg = 'PIN dinonaktifkan.'; },
  logout: () => logout(),
  dprev: () => { ui.day = addDays(ui.day, -1); }, dnext: () => { ui.day = addDays(ui.day, 1); }, dtoday: () => { ui.day = startOfDay(new Date()); },
  openday: b => { ui.day = new Date(Number(b.dataset.d)); ui.section = 'Transaksi'; window.scrollTo(0, 0); },
  unlock: async () => { const p = JSON.parse(ls.get('pin') || 'null'); const v = $('#pin-in').value; if (!p || await hashPin(v, p.salt) === p.hash) { ui.locked = false; reminder(); } else { $('#pin-err').textContent = 'PIN salah.'; $('#pin-in').value = ''; throw null; } },
  bsave: () => download(backupName(), backupJSON(), 'application/json'),
  bopen: () => pickFile('.json,application/json', async f => { let l; try { l = JSON.parse(await f.text()); } catch { fail('Berkas backup tidak dapat dibaca.'); } previewRestore(l, `Backup "${f.name}"`); }),
  csvall: () => download('SakuMac-transaksi.csv', '﻿' + CSV.export(L, L.entries), 'text/csv'),
  csvopen: () => pickFile('.csv,text/csv,text/plain', async f => { const [l, n] = CSV.importing(await f.text(), L); commit(l); ui.msg = `${n} transaksi ditambahkan. Duplikat identik dilewati.`; }),
  xlsxopen: () => pickFile('.xlsx', async f => { const rows = Sepran.rows(await Sepran.grid(await f.arrayBuffer())); const [l, n, s] = await Sepran.importing(rows, L); commit(l); ui.msg = `Sepran: ${n} transaksi baru ditambahkan ke dompet "Sepran", ${s} sudah ada dilewati.`; }),
  server: async () => { const l = await serverLedger(); previewRestore(l, `Data server "${USER}"`); },
  mail: async () => {
    const addr = $('#gmail').value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)) fail('Masukkan alamat Gmail yang valid.'); ls.set('gmail', addr);
    const day = ymd(new Date()); const subject = `Backup SakuMac ${day}`; const body = `Backup SakuMac ${day}: ${L.entries.length} transaksi, ${L.wallets.length} dompet. Pulihkan lewat SakuMac → Backup & pengaturan → Pulihkan backup….`;
    const file = new File([backupJSON()], backupName(), { type: 'application/json' }); ls.set('lastMail', String(Date.now()));
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: subject, text: body }); ui.msg = 'Backup dibagikan. Pastikan email terkirim ke ' + addr + '.'; return; } catch (e) { if (e.name === 'AbortError') { ui.msg = 'Berbagi dibatalkan.'; return; } } }
    download(file.name, file, 'application/json');
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(addr)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body + '\n\n(Lampirkan berkas ' + file.name + ' dari folder Unduhan.)')}`, '_blank', 'noopener');
    ui.msg = `Berkas ${file.name} diunduh dan Gmail dibuka. Lampirkan berkas itu, lalu klik Kirim.`;
  }
};
const CHANGE = {
  dpick: el => { if (el.value) ui.day = fromDateInput(el.value); },
  theme: el => { ls.set('appearance', el.value); applyTheme(); },
  weekly: el => { ls.set('weeklyMail', el.checked ? '1' : '0'); },
  rpreset: el => { const r = ui.rep, t = new Date(); const v = el.value; if (!v) return;
    if (/^\d+$/.test(v)) { r.start = dateInput(addMonths(monthStart(t), -(Number(v) - 1))); r.end = dateInput(t); }
    else if (v === 'ty') { r.start = dateInput(new Date(t.getFullYear(), 0, 1)); r.end = dateInput(t); }
    else if (v === 'ly') { r.start = dateInput(new Date(t.getFullYear() - 1, 0, 1)); r.end = dateInput(new Date(t.getFullYear() - 1, 11, 31)); }
    else { const first = L.entries.reduce((m, e) => Math.min(m, Date.parse(e.date)), Date.now()); r.start = dateInput(first); r.end = dateInput(t); } }
};
async function run(fn) { try { await fn(); } catch (e) { if (e === null) return; ui.msg = e?.message || String(e); } render(); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (dlg().open && dlg().contains(ev.target)) return;
  if (!b) { if (ui.menu && !ev.target.closest('.menu')) { ui.menu = null; render(); } return; }
  const f = A[b.dataset.a]; if (f) { ev.preventDefault(); run(() => f(b, ev)); }
});
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset.aChange) run(() => CHANGE[el.dataset.aChange](el)); else if (el.dataset.bind && el.type !== 'text' && el.type !== 'search') bind(el); });
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset.bind && (el.type === 'text' || el.type === 'search')) bind(el); });
document.addEventListener('keydown', ev => {
  if (USER && !ui.locked && ui.section === 'Transaksi' && !dlg().open && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '') && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) { run(ev.key === 'ArrowLeft' ? A.dprev : A.dnext); return; } if (ev.key === 'Enter' && ev.target.id === 'pin-in') run(A.unlock); if (ev.key === 'Escape' && ui.menu) { ui.menu = null; render(); } });
function bind(el) {
  const [o, k] = el.dataset.bind.split('.'); ui[o][k] = el.type === 'checkbox' ? el.checked : el.value;
  if (o === 'rep' && k === 'wallet') ui.rep.selected = null; if (o === 'tx') ui.tx.limit = 300;
  if (o === 'wal' || o === 'cat') return; // form fields: no re-render while typing
  render();
}
document.addEventListener('submit', ev => { if (ev.target.id !== 'gate-form') return; ev.preventDefault(); const btn = ev.target.querySelector('button'); const v = $('#user-in').value; btn.disabled = true; btn.textContent = 'Membuka…';
  login(v).then(render, e => { USER = null; L = null; btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = e.message; }); });
let touch = null;
document.addEventListener('touchstart', ev => { touch = ui.section === 'Transaksi' && ev.target.closest('#view') ? [ev.touches[0].clientX, ev.touches[0].clientY] : null; }, { passive: true });
document.addEventListener('touchend', ev => { if (!touch) return; const dx = ev.changedTouches[0].clientX - touch[0], dy = ev.changedTouches[0].clientY - touch[1]; touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) run(dx < 0 ? A.dnext : A.dprev); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden && USER && ls.get('pin') && !ui.locked) { ui.locked = true; if (dlg().open) dlg().close(); render(); } });
